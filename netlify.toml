# Netlify deploy config.
#
# The deployable site is site/, not the repository root. Everything beside it
# is workshop material: tools/, reference/, cms/, screenshots/, import-*/.
# Without this file Netlify publishes the root, finds no index.html, and every
# link 404s, which is exactly what happened.
#
# There is no build step by design: plain HTML, CSS and ES modules. Nothing to
# install, nothing to compile.

[build]
  publish = "site"
  command = ""
  # The one piece of the deploy that is not a static file. netlify/functions
  # sits OUTSIDE site/ on purpose: it is deployed as a function, never served
  # as an asset, so site/ stays a folder you could copy to any static host.
  # Still no build step and no dependencies — the function is one .mjs file
  # using the runtime's own fetch.
  #
  # spaces-agent needs ANTHROPIC_API_KEY in Netlify's environment variables.
  # Without it the endpoint answers 503 and ILLUSORR Spaces falls back to its
  # scripted lines, which is the behaviour the site had before it existed.
  functions = "netlify/functions"

# site/404.html is picked up automatically as the not-found page.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# CACHE POLICY. Read this before widening anything here.
#
# There is no build step, so NOTHING in assets/ is fingerprinted: the files
# are mobile.css, nav.css, site-footer.js, forever. "immutable" on a name
# that gets rewritten is a promise the site cannot keep — it tells the
# browser not even to revalidate, so a phone that loaded the site once was
# pinned to that day's CSS for a year and no deploy could reach it.
#
# Long caches are therefore only for files whose CONTENT is stable for the
# life of the name. Stylesheets and scripts are not; they carry a ?v= stamp
# in the markup instead, and that stamp is what makes a new one a new URL.
#
# Netlify applies every matching rule in order and the last one wins for a
# given header, so the specific rules below override the general one above.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts are genuinely stable: a different face means a different file name.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and video are heavy and rarely rewritten in place, but they are not
# fingerprinted either — a month, and no immutable, so a replacement lands.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Pages must revalidate so a deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# OLD SITE (Wix) ADDRESSES. The domain ran a Wix site until 2026-09-08 and Google still
# holds its URLs. The real pages redirect to their new homes. The rest, a forum
# that had filled with gambling spam, member areas, challenge pages and Wix
# internals, answer 410 Gone so they leave the index faster than a 404 would.
# force = true so these win even though the paths do not exist as files.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
