# Netlify deploy config.
#
# The deployable site is site/, not the repository root. Everything beside it
# is workshop material: tools/, reference/, cms/, screenshots/, import-*/.
# Without this file Netlify publishes the root, finds no index.html, and every
# link 404s, which is exactly what happened.
#
# There is no build step by design: plain HTML, CSS and ES modules. Nothing to
# install, nothing to compile.

[build]
  publish = "site"
  command = ""

# site/404.html is picked up automatically as the not-found page.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fingerprinted and versioned media can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pages must revalidate so a deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
