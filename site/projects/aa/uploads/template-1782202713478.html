stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 5 16 12 9 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n\n        <div class=\"hc-bars\" id=\"hcBars\" aria-hidden=\"true\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3. PROJECT META BAR -->\n  <section data-tone=\"light\" data-rail=\"1\" data-screen-label=\"03 Meta\">\n    <div class=\"wrap\">\n      <div class=\"meta-bar\">\n        <div class=\"meta-cell\">\n          <span class=\"meta-k\">Client<\u002Fspan>\n          <span class=\"meta-v\">Aquatic Architects<br>Marine Design · Architecture<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta-cell\">\n          <span class=\"meta-k\">Year<\u002Fspan>\n          <span class=\"meta-v\">2026<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta-cell\">\n          <span class=\"meta-k\">Discipline<\u002Fspan>\n          <span class=\"meta-v\">Design &amp; Build, End-to-End<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta-cell\">\n          <span class=\"meta-k\">Scope<\u002Fspan>\n          <span class=\"meta-v\">UX, UI, Front-End, Media Pipeline<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta-cell\">\n          <span class=\"meta-k\">Output<\u002Fspan>\n          <span class=\"meta-v\">One Living Website · ~10 MB · 1080p<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3. THE BRIEF -->\n  <section class=\"module\" data-tone=\"light\" data-rail=\"2\" data-screen-label=\"03 Brief\">\n    <div class=\"wrap\">\n      <div class=\"module-head\">\n        <div class=\"section-num\">\n          <span class=\"num\">01<\u002Fspan>\n          The Brief\n        <\u002Fdiv>\n        <div>\n          <h2 class=\"module-title\">A blank canvas, <em>made flagship.<\u002Fem><\u002Fh2>\n          <p class=\"lede\">\n            Aquatic Architects had spent years redefining life on water, from the UAE to\n            coastlines worldwide. What they didn't have was a place online to let the\n            work speak. They came to us to build one.\n          <\u002Fp>\n          <div class=\"body-grid\">\n            <div>\n              <p>Not a brochure, but a digital flagship: somewhere the ambition of the projects could actually be felt, and somewhere serious clients and partners could meet the brand on its own terms.<\u002Fp>\n              <p>We took it from a blank canvas to a finished, living website, designed and built end-to-end in-studio.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p>The palette is drawn from the water: deep greens, near-blacks, soft light. The typography stays out of the way and lets the work lead.<\u002Fp>\n              <p>Every section was built to hold attention without demanding it, and to feel just as considered on a phone as on a wide screen.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4. THE EXPERIENCE -->\n  <section class=\"module\" data-tone=\"light\" data-rail=\"3\" data-screen-label=\"04 Experience\" style=\"padding-top: 0;\">\n    <div class=\"wrap\">\n      <div class=\"module-head\">\n        <div class=\"section-num\">\n          <span class=\"num\">02<\u002Fspan>\n          The Experience\n        <\u002Fdiv>\n        <div>\n          <h2 class=\"module-title\">Calm, deep, <em>and cinematic.<\u002Fem><\u002Fh2>\n          <p class=\"lede\">We wanted the site to feel less like a page and more like a descent, the way the work itself feels.<\u002Fp>\n          <div class=\"body-grid\">\n            <div>\n              <p>It opens on film. A hero sequence sets the mood before a word is read, easing into an intro animation that lets the brand arrive rather than announce itself.<\u002Fp>\n              <p>From there the journey unfolds in chapters: the projects, shown with room to breathe; the studio's signature methodology, made tangible; and a quiet wall of recognition.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p>The palette is drawn from the water: deep greens, near-blacks, soft light. The typography stays out of the way.<\u002Fp>\n              <p>Every section was built to hold attention without demanding it, and to feel just as considered on a phone as on a wide screen.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5. FULL BLEED, hero sequence -->\n  <section class=\"bleed\" data-tone=\"light\" data-rail=\"3\" data-screen-label=\"05 Hero Sequence\">\n    <div class=\"wrap\">\n      <div class=\"ph\" style=\"aspect-ratio: 16 / 9;\">\n        <span class=\"ph-label\">Hero Sequence<\u002Fspan>\n        <span class=\"ph-dim\">Aquatic Architects · Home<\u002Fspan>\n        <span class=\"caption\">\n          <span>The opening film that sets the mood before a word is read<\u002Fspan>\n          <span>16:9 · Video<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6. TWO-UP, projects + method -->\n  <section data-tone=\"light\" data-rail=\"4\" data-screen-label=\"06 Two-Up\">\n    <div class=\"wrap\">\n      <div class=\"duo\">\n        <div class=\"col col-a\">\n          <div class=\"ph\"><span class=\"ph-label\">Projects<\u002Fspan><span class=\"caption\"><span>Work, shown with room to breathe<\u002Fspan><span>4:3<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <span class=\"cap\">The projects index, laid out with generous negative space.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"col col-b\">\n          <div class=\"ph\"><span class=\"ph-label\">Methodology<\u002Fspan><span class=\"caption\"><span>Design method, made tangible<\u002Fspan><span>3:4<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <span class=\"cap\">The studio's signature methodology, told as a scroll.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7. FULL BLEED, cinematic -->\n  <section class=\"bleed\" data-tone=\"light\" data-rail=\"4\" data-screen-label=\"07 Cinematic\">\n    <div class=\"wrap\">\n      <div class=\"ph\" style=\"aspect-ratio: 21 / 9;\">\n        <span class=\"ph-label\">Project Visual<\u002Fspan>\n        <span class=\"ph-dim\">Aquatic Architects · Live<\u002Fspan>\n        <span class=\"caption\">\n          <span>Projects shown full-bleed, with room to breathe<\u002Fspan>\n          <span>21:9 · Cinematic<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════════════════════════════════════════════════\n       SEAM, visual stitch between halves\n       ════════════════════════════════════════════════════════════════ -->\n  <div class=\"seam\" aria-hidden=\"true\"><\u002Fdiv>\n\n  <!-- ════════════════════════════════════════════════════════════════\n       DARK HALF\n       ════════════════════════════════════════════════════════════════ -->\n\n  <!-- 6. THE APPROACH -->\n  <section class=\"module\" data-tone=\"dark\" data-rail=\"5\" data-screen-label=\"06 Approach\">\n    <div class=\"wrap\">\n      <div class=\"module-head\">\n        <div class=\"section-num\">\n          <span class=\"num\">03<\u002Fspan>\n          Under the Hood\n        <\u002Fdiv>\n        <div>\n          <h2 class=\"module-title\">Beautiful. <em>And fast.<\u002Fem><\u002Fh2>\n          <p class=\"lede\">\n            A site this video-led usually carries a hidden cost: weight. We weren't\n            willing to trade the atmosphere for the speed, so we engineered our way\n            out of the choice.\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"process\">\n        <div class=\"step\">\n          <span class=\"step-k\">Phase 01 · Design<\u002Fspan>\n          <h4>Set the Mood<\u002Fh4>\n          <p>We designed the whole experience as a descent, palette drawn from the water, with a hero film and intro animation that let the brand arrive rather than announce itself.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"step\">\n          <span class=\"step-k\">Phase 02 · Build<\u002Fspan>\n          <h4>End to End<\u002Fh4>\n          <p>We built the site from a blank canvas: structure, interaction and front-end, every chapter laid out to feel as considered on a phone as on a wide screen.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"step\">\n          <span class=\"step-k\">Phase 03 · Optimise<\u002Fspan>\n          <h4>Light and Fast<\u002Fh4>\n          <p>We rebuilt the media pipeline from the ground up, every image and film tuned to full 1080p while keeping the whole experience to around ten megabytes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7. GALLERY, two rows of looks -->\n  <section data-tone=\"dark\" data-rail=\"6\" data-screen-label=\"07 Gallery\">\n    <div class=\"wrap\">\n      <div class=\"look-split\">\n        <div class=\"look-group\">\n          <div class=\"lg-head\">The Method<\u002Fdiv>\n          <div class=\"lg-grid\">\n            <div class=\"ph\">\n              <span class=\"ph-label\">Methodology 01<\u002Fspan>\n              <span class=\"caption\"><span>Design method, made tangible<\u002Fspan><span>Chapter<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"ph\">\n              <span class=\"ph-label\">Methodology 02<\u002Fspan>\n              <span class=\"caption\"><span>Told as a scroll<\u002Fspan><span>Chapter<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"look-group\">\n          <div class=\"lg-head\">Recognition<\u002Fdiv>\n          <div class=\"lg-grid\">\n            <div class=\"ph\">\n              <span class=\"ph-label\">Recognition 01<\u002Fspan>\n              <span class=\"caption\"><span>A quiet wall of names<\u002Fspan><span>Chapter<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"ph\">\n              <span class=\"ph-label\">Recognition 02<\u002Fspan>\n              <span class=\"caption\"><span>Partners &amp; press<\u002Fspan><span>Chapter<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8. PULL QUOTE -->\n  <section class=\"quote-wrap\" data-tone=\"dark\" data-rail=\"7\" data-screen-label=\"08 Quote\">\n    <div class=\"wrap\">\n      <blockquote class=\"quote\">\n        <span class=\"quote-mark\">“<\u002Fspan>\n        Beautiful is easy to promise. Beautiful and fast is the work, especially when\n        the whole experience, films and all, has to load in seconds.\n        <div class=\"quote-attrib\">\n          <span class=\"rule\"><\u002Fspan>\n          <span>ILLUSORR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9. FULL BLEED IMAGE -->\n  <section class=\"bleed\" data-tone=\"dark\" data-rail=\"7\" data-screen-label=\"09 Hero Still\">\n    <div class=\"wrap\">\n      <div class=\"ph\" style=\"aspect-ratio: 21 / 9;\">\n        <span class=\"ph-label\">Key Visual<\u002Fspan>\n        <span class=\"ph-dim\">Aquatic Architects · Live<\u002Fspan>\n        <span class=\"caption\">\n          <span>The finished flagship, full-bleed and cinematic<\u002Fspan>\n          <span>Key visual<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10. RESULTS / STATS -->\n  <section class=\"module\" data-tone=\"dark\" data-rail=\"7\" data-screen-label=\"10 Results\">\n    <div class=\"wrap\">\n      <div class=\"module-head\">\n        <div class=\"section-num\">\n          <span class=\"num\">06<\u002Fspan>\n          The Outcome\n        <\u002Fdiv>\n        <div>\n          <h2 class=\"module-title\">A flagship that loads in seconds. <em>On brand, on every device.<\u002Fem><\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"stats\">\n        <div class=\"stat\">\n          <span class=\"stat-n\">~10<span class=\"sm\">MB<\u002Fspan><\u002Fspan>\n          <span class=\"stat-k\">Total page weight, films and all<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <span class=\"stat-n\">1080<span class=\"sm\">p<\u002Fspan><\u002Fspan>\n          <span class=\"stat-k\">Full HD imagery and video throughout<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <span class=\"stat-n\">100<span class=\"sm\">%<\u002Fspan><\u002Fspan>\n          <span class=\"stat-k\">Responsive, considered on every device<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <span class=\"stat-n\">E<span class=\"sm\">2E<\u002Fspan><\u002Fspan>\n          <span class=\"stat-k\">Designed &amp; built end-to-end in-studio<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"credits\">\n        <div>\n          <span class=\"section-num\" style=\"display:block; margin-bottom: 0;\">\n            <span class=\"num\" style=\"font-size: clamp(28px, 3vw, 48px);\">07<\u002Fspan>\n            Credits\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"credit-list\">\n          <div class=\"credit-row\"><span class=\"role\">Design<\u002Fspan><span class=\"who\">ILLUSORR Studio<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Development<\u002Fspan><span class=\"who\">ILLUSORR Labs<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Art Direction<\u002Fspan><span class=\"who\">ILLUSORR<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Media Pipeline<\u002Fspan><span class=\"who\">ILLUSORR Labs<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Experience<\u002Fspan><span class=\"who\">Cinematic, video-led<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Client<\u002Fspan><span class=\"who\">Aquatic Architects<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Discipline<\u002Fspan><span class=\"who\">Design &amp; Build<\u002Fspan><\u002Fdiv>\n          <div class=\"credit-row\"><span class=\"role\">Year<\u002Fspan><span class=\"who\">2026<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11. NEXT PROJECT TEASER -->\n  <section class=\"next\" data-tone=\"dark\" data-rail=\"7\" data-screen-label=\"11 Next\">\n    <div class=\"next-bg\">\n      <div class=\"ph\">\n        <span class=\"ph-label\">Denim · Cover<\u002Fspan>\n        <span class=\"ph-dim\">Next Project<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"next-inner\">\n      <span class=\"next-k\">Next Project · 012<\u002Fspan>\n      <h3>\n        <span style=\"display:block\">Denim<\u002Fspan>\n        <span style=\"display:block; font-weight:400; font-style:italic; color: var(--ink-soft); letter-spacing: 0;\">two banners, from reference.<\u002Fspan>\n      <\u002Fh3>\n      <div class=\"next-meta\">\n        <span>2025<\u002Fspan>\n        <span>·<\u002Fspan>\n        <span>AI Production<\u002Fspan>\n        <span>·<\u002Fspan>\n        <span>Campaign<\u002Fspan>\n      <\u002Fdiv>\n      <a class=\"next-cta\" href=\"#\">\n        <span>View Case Study<\u002Fspan>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M5 19 L19 5\"><\u002Fpath><polyline points=\"9 5 19 5 19 15\"><\u002Fpolyline>\n        <\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer class=\"foot\" data-tone=\"dark\">\n    <div>© ILLUSORR Labs · MMXXVI<\u002Fdiv>\n    <div>Aquatic Architects · Digital Flagship<\u002Fdiv>\n  <\u002Ffooter>\n\n<script>\n  /* ───────────────────────────────────────────────────────────────────\n     KOTON cursor, smooth-lerped pointer follower. Reads pointer\n     coords, animates the disc toward them with a fixed friction\n     factor (~0.18 per frame). Toggles .is-link when over a clickable\n     element and .is-down on press.\n     ─────────────────────────────────────────────────────────────────── */\n  (function() {\n    if (window.matchMedia('(hover: none)').matches) return;\n    const cursor = document.getElementById('kCursor');\n    if (!cursor) return;\n\n    const pt = { x: window.innerWidth / 2, y: window.innerHeight / 2 };\n    const lp = { x: pt.x, y: pt.y };\n    let raf = null;\n    let visible = false;\n\n    function tick() {\n      lp.x += (pt.x - lp.x) * 0.22;\n      lp.y += (pt.y - lp.y) * 0.22;\n      cursor.style.transform = `translate3d(${lp.x}px, ${lp.y}px, 0)`;\n      raf = requestAnimationFrame(tick);\n    }\n    tick();\n\n    window.addEventListener('pointermove', (e) => {\n      pt.x = e.clientX; pt.y = e.clientY;\n      if (!visible) { cursor.classList.add('is-visible'); visible = true; }\n    }, { passive: true });\n\n    // Fade out when the pointer leaves the document area\n    document.addEventListener('mouseleave', () => cursor.classList.remove('is-visible'));\n    document.addEventListener('mouseenter', () => cursor.classList.add('is-visible'));\n\n    /* Tone detection, sample the section under the cursor and flip\n       the disc colours so it always contrasts against the bg. Runs\n       once per pointermove, not per frame, to keep it cheap. */\n    let lastTone = null;\n    function updateTone() {\n      const el = document.elementFromPoint(pt.x, pt.y);\n      if (!el) return;\n      const sec = el.closest('[data-tone]');\n      const tone = sec ? sec.getAttribute('data-tone') : 'light';\n      if (tone === lastTone) return;\n      lastTone = tone;\n      cursor.classList.toggle('on-dark', tone === 'dark');\n    }\n    window.addEventListener('pointermove', updateTone, { passive: true });\n\n    // Press feedback\n    window.addEventListener('pointerdown', () => cursor.classList.add('is-down'));\n    window.addEventListener('pointerup',   () => cursor.classList.remove('is-down'));\n\n    // Detect interactive elements under the cursor and inflate the disc\n    const linkSel = 'a, button, [role=\"button\"], .next, label, .topnav .logo-lockup';\n    document.querySelectorAll(linkSel).forEach(el => {\n      el.addEventListener('pointerenter', () => {\n        cursor.classList.add('is-link');\n        // Pick the verb that best fits the element\n        const label = cursor.querySelector('.label-link');\n        if (label) {\n          let verb = 'Click';\n          if (el.matches('.next') || el.matches('.next-cta')) verb = 'View Case';\n          else if (el.closest('.topnav')) verb = 'Open';\n          else if (el.matches('[href^=\"http\"]')) verb = 'Visit';\n          label.setAttribute('data-verb', verb);\n        }\n      });\n      el.addEventListener('pointerleave', () => cursor.classList.remove('is-link'));\n    });\n\n    /* Text-hover detection, over any heading or paragraph block,\n       flip .is-text so the emblem starts its slow rotation. */\n    const textSel = 'p, h1, h2, h3, h4, blockquote, .lede, .hero-lede, .description, .meta-v, .credit-row .who, .quote, .module-title, .hero-title';\n    document.querySelectorAll(textSel).forEach(el => {\n      // Skip elements that are themselves inside links/buttons (the\n      // link state takes priority and hides the emblem anyway).\n      if (el.closest('a, button, [role=\"button\"], .next')) return;\n      el.addEventListener('pointerenter', () => cursor.classList.add('is-text'));\n      el.addEventListener('pointerleave', () => cursor.classList.remove('is-text'));\n    });\n\n    /* Topnav + rail tone, synced to the section currently behind the\n       fixed chrome (topnav: section at top of viewport; rail: section\n       at viewport middle). Replaces the old mix-blend-mode trick that\n       was clashing with the cursor's compositing. */\n    const topnav = document.querySelector('.topnav');\n    const rail   = document.querySelector('.rail');\n    const sections = Array.from(document.querySelectorAll('section[data-tone]'));\n    function sectionAt(y) {\n      for (const s of sections) {\n        const r = s.getBoundingClientRect();\n        if (r.top <= y && r.bottom >= y) return s;\n      }\n      return null;\n    }\n    function updateChromeTone() {\n      const topSec = sectionAt(40);\n      const midSec = sectionAt(window.innerHeight / 2);\n      if (topnav) topnav.classList.toggle('on-dark', !!topSec && topSec.dataset.tone === 'dark');\n      if (rail)   rail.classList.toggle('on-dark', !!midSec && midSec.dataset.tone === 'dark');\n    }\n    updateChromeTone();\n    window.addEventListener('scroll', () => requestAnimationFrame(updateChromeTone), { passive: true });\n    window.addEventListener('resize', updateChromeTone);\n  })();\n\n  /* ───────────────────────────────────────────────────────────────────\n     Side-rail progress indicator. Each section carries data-rail=\"N\"\n     pointing at one of the eight dots; the closest-to-viewport-center\n     section wins. Pure read of bounding rects, no observer overhead.\n     ─────────────────────────────────────────────────────────────────── */\n  (function() {\n    const sections = Array.from(document.querySelectorAll('[data-rail]'));\n    const dots = Array.from(document.querySelectorAll('.rail-dot'));\n    function tick() {\n      const mid = window.innerHeight / 2;\n      let best = 0, bestDist = Infinity;\n      for (const s of sections) {\n        const r = s.getBoundingClientRect();\n        const c = (r.top + r.bottom) / 2;\n        const d = Math.abs(c - mid);\n        if (d < bestDist) { bestDist = d; best = +s.dataset.rail; }\n      }\n      dots.forEach(d => d.classList.toggle('is-active', +d.dataset.i === best));\n    }\n    tick();\n    window.addEventListener('scroll', () => requestAnimationFrame(tick), { passive: true });\n    window.addEventListener('resize', tick);\n  })();\n\n  /* Smooth in-page anchor scroll for the topnav links (cosmetic, they\n     don't currently point anywhere meaningful, but if you wire them up\n     this gives the soft scroll Dogstudio uses). */\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', e => {\n      const id = a.getAttribute('href');\n      if (id.length < 2) return;\n      const t = document.querySelector(id);\n      if (!t) return;\n      e.preventDefault();\n      const y = t.getBoundingClientRect().top + window.scrollY;\n      window.scrollTo({ top: y, behavior: 'smooth' });\n    });\n  });\n<\u002Fscript>\n\n<!-- ──────────────────────────────────────────────────────────────────────\n     Hero carousel, Zara-style horizontal image scroll. translateX track,\n     autoplay with progress bars, arrows, drag/swipe, keyboard. Pauses on\n     hover and when off-screen.\n     ────────────────────────────────────────────────────────────────────── -->\n<script>\n(() => {\n  const root = document.getElementById('heroCarousel');\n  if (!root) return;\n  const track  = document.getElementById('hcTrack');\n  const slides = Array.from(track.children);\n  const N = slides.length;\n  const DUR = 5200;\n\n  const nowEl = document.getElementById('hcNow');\n  const totEl = document.getElementById('hcTot');\n  const lookEl = document.getElementById('hcLook');\n  const titleEl = document.getElementById('hcTitle');\n  const subEl = document.getElementById('hcSub');\n  const barsWrap = document.getElementById('hcBars');\n  root.style.setProperty('--hc-dur', (DUR / 1000) + 's');\n\n  let page = 0, visible = 3, pages = N, timer = null, paused = false, bars = [];\n\n  function buildBars() {\n    barsWrap.innerHTML = '';\n    bars = [];\n    for (let p = 0; p < pages; p++) {\n      const b = document.createElement('button');\n      b.className = 'hc-bar';\n      b.setAttribute('aria-label', 'Go to page ' + (p + 1));\n      b.innerHTML = '<span class=\"fill\"><\u002Fspan>';\n      b.addEventListener('click', () => go(p, true));\n      barsWrap.appendChild(b);\n      bars.push(b);\n    }\n    totEl.textContent = '/ ' + String(pages).padStart(2, '0');\n  }\n\n  function measure() {\n    const step = slides.length > 1 ? (slides[1].offsetLeft - slides[0].offsetLeft) : root.clientWidth;\n    visible = Math.max(1, Math.round(root.clientWidth / step));\n    const np = Math.max(1, Math.ceil(N / visible));\n    if (np !== pages || bars.length !== np) { pages = np; buildBars(); }\n    page = Math.min(page, pages - 1);\n  }\n\n  function render() {\n    const firstIdx = Math.min(page * visible, N - 1);\n    const maxScroll = Math.max(0, track.scrollWidth - root.clientWidth);\n    const x = Math.min(slides[firstIdx].offsetLeft, maxScroll);\n    track.style.transform = `translateX(${-x}px)`;\n    slides.forEach((s, i) => s.classList.toggle('is-active', i >= firstIdx && i < firstIdx + visible));\n    const s = slides[firstIdx];\n    nowEl.textContent = String(page + 1).padStart(2, '0');\n    lookEl.textContent = s.dataset.look || '';\n    titleEl.textContent = s.dataset.title || '';\n    subEl.textContent = s.dataset.sub || '';\n    bars.forEach((b, p) => { b.classList.toggle('is-done', p < page); b.classList.remove('is-active'); });\n    if (bars[page]) { void bars[page].offsetWidth; if (!paused) bars[page].classList.add('is-active'); }\n  }\n\n  function go(p, user) { page = (p + pages) % pages; render(); if (user) restart(); }\n  function next() { go(page + 1); }\n  function prev() { go(page - 1, true); }\n\n  function restart() { clearTimeout(timer); if (paused) return; timer = setTimeout(next, DUR); }\n\n  document.getElementById('hcNext').addEventListener('click', () => { next(); restart(); });\n  document.getElementById('hcPrev').addEventListener('click', prev);\n\n  root.addEventListener('pointerenter', () => { paused = true; clearTimeout(timer); if (bars[page]) bars[page].classList.remove('is-active'); });\n  root.addEventListener('pointerleave', () => { paused = false; render(); restart(); });\n\n  let down = false, sx = 0, dx = 0, baseX = 0;\n  track.addEventListener('pointerdown', (e) => {\n    down = true; sx = e.clientX; dx = 0;\n    const firstIdx = Math.min(page * visible, N - 1);\n    baseX = Math.min(slides[firstIdx].offsetLeft, Math.max(0, track.scrollWidth - root.clientWidth));\n    track.classList.add('no-anim'); track.setPointerCapture?.(e.pointerId);\n  });\n  track.addEventListener('pointermove', (e) => {\n    if (!down) return;\n    dx = e.clientX - sx;\n    track.style.transform = `translateX(${-(baseX - dx)}px)`;\n  });\n  function endDrag() {\n    if (!down) return;\n    down = false; track.classList.remove('no-anim');\n    const th = root.clientWidth * 0.12;\n    if (dx < -th) go(page + 1, true);\n    else if (dx > th) go(page - 1, true);\n    else render();\n  }\n  track.addEventListener('pointerup', endDrag);\n  track.addEventListener('pointercancel', endDrag);\n\n  root.setAttribute('tabindex', '0');\n  root.addEventListener('keydown', (e) => {\n    if (e.key === 'ArrowRight') { next(); restart(); }\n    else if (e.key === 'ArrowLeft') { prev(); }\n  });\n\n  let wheelLock = false;\n  root.addEventListener('wheel', (e) => {\n    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);\n    if (Math.abs(horiz) < 12) return;\n    e.preventDefault();\n    if (wheelLock) return;\n    wheelLock = true;\n    if (horiz > 0) { next(); restart(); } else { prev(); }\n    setTimeout(() => { wheelLock = false; }, 520);\n  }, { passive: false });\n\n  function layout() { measure(); render(); }\n  layout();\n  window.addEventListener('resize', () => { track.classList.add('no-anim'); layout(); requestAnimationFrame(() => track.classList.remove('no-anim')); });\n  window.addEventListener('load', layout);\n\n  if ('IntersectionObserver' in window) {\n    new IntersectionObserver(([en]) => {\n      if (en.isIntersecting && !paused) { render(); restart(); }\n      else { clearTimeout(timer); if (bars[page]) bars[page].classList.remove('is-active'); }\n    }, { threshold: 0.2 }).observe(root);\n  } else { restart(); }\n})();\n<\u002Fscript>\n\n<!-- ──────────────────────────────────────────────────────────────────────\n     Hero emblem pile, black Boyner cloverleaf marks with gravity. They\n     fall into the blank pocket on the right of the hero and stack on top\n     of each other (circle collision + floor). The cursor knocks the pile\n     around; gravity re-settles it. Pure DOM + transform, no canvas.\n     ────────────────────────────────────────────────────────────────────── -->\n<script>\n(() => {\n  const root = document.getElementById('filmCarousel');\n  if (!root) return;\n  const track = document.getElementById('filmTrack');\n  const slides = Array.from(track.children);\n  const N = slides.length;\n  const dotsWrap = document.getElementById('filmDots');\n  let i = 0, t = null;\n  const dots = slides.map((_, k) => { const b = document.createElement('button'); b.className = 'film-dot'; b.setAttribute('aria-label', 'Film ' + (k + 1)); b.addEventListener('click', () => go(k, true)); dotsWrap.appendChild(b); return b; });\n  function render() { track.style.transform = `translateX(${-i * 100}%)`; dots.forEach((d, k) => d.classList.toggle('is-active', k === i)); }\n  function go(n, u) { i = (n + N) % N; render(); if (u) restart(); }\n  function restart() { clearTimeout(t); t = setTimeout(() => go(i + 1), 6000); }\n  document.getElementById('filmNext').addEventListener('click', () => go(i + 1, true));\n  document.getElementById('filmPrev').addEventListener('click', () => go(i - 1, true));\n  let down = false, sx = 0, dx = 0;\n  track.addEventListener('pointerdown', e => { down = true; sx = e.clientX; dx = 0; track.classList.add('no-anim'); track.setPointerCapture?.(e.pointerId); });\n  track.addEventListener('pointermove', e => { if (!down) return; dx = e.clientX - sx; track.style.transform = `translateX(calc(${-i * 100}% + ${dx}px))`; });\n  function end() { if (!down) return; down = false; track.classList.remove('no-anim'); const th = root.clientWidth * 0.14; if (dx < -th) go(i + 1, true); else if (dx > th) go(i - 1, true); else render(); }\n  track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);\n  root.addEventListener('pointerenter', () => clearTimeout(t));\n  root.addEventListener('pointerleave', restart);\n  render(); restart();\n})();\n<\u002Fscript>\n\n<script>\n(() => {\n  const hero = document.querySelector('.hero');\n  if (!hero) return;\n  const canvas = document.createElement('canvas');\n  canvas.className = 'hero-paint';\n  canvas.setAttribute('aria-hidden', 'true');\n  hero.insertBefore(canvas, hero.firstChild);\n  const ctx = canvas.getContext('2d');\n\n  // Low-res offscreen field. We blur INSIDE the canvas (cheap — few pixels)\n  // and let the GPU upscale it, instead of CSS-blurring the full-size hero\n  // element every frame (which causes the stutter).\n  const SCALE = 0.24;\n  let W = 0, H = 0, w = 0, h = 0, BLUR = 6;\n  function size() {\n    const r = hero.getBoundingClientRect();\n    W = r.width; H = r.height;\n    w = Math.max(2, Math.round(W * SCALE));\n    h = Math.max(2, Math.round(H * SCALE));\n    canvas.width = w; canvas.height = h;\n    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';\n    BLUR = Math.max(4, Math.round(Math.min(w, h) * 0.09));\n  }\n  size();\n  window.addEventListener('resize', size);\n\n  // Palette + hero gradient defaults (rewritten on disk by the Tweaks host).\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"mesh1\": \"#7FD0C0\",\n    \"mesh2\": \"#1E9A88\",\n    \"mesh3\": \"#0A3B38\",\n    \"heroStop1\": \"#6FC6B6\",\n    \"heroStop2\": \"#1E8A7C\",\n    \"heroStop3\": \"#08312F\",\n    \"frequency\": 0.55,\n    \"speed\": 0.75,\n    \"noiseType\": \"curl\"\n  }/*EDITMODE-END*/;\n  let PAL = [TWEAKS.mesh1, TWEAKS.mesh2, TWEAKS.mesh3];\n  let FREQ = TWEAKS.frequency, SPEED = TWEAKS.speed, NOISE = TWEAKS.noiseType;\n  const PI = [0, 1, 2, 0, 1, 2];\n  // Drifting blobs, each carrying a colour by palette index. hx/hy is the\n  // blob's home anchor — it always eases back toward it so the composition\n  // stays balanced and never relies on edge teleport-wrapping.\n  const BLOBS = PI.map((pi) => {\n    const x = 0.12 + Math.random() * 0.76, y = 0.12 + Math.random() * 0.76;\n    return {\n      pi, c: PAL[pi], x, y, hx: x, hy: y,\n      rx: 0.34 + Math.random() * 0.22, ry: 0.34 + Math.random() * 0.22,\n      px: Math.random() * 6.28, py: Math.random() * 6.28,\n      sx: 0.10 + Math.random() * 0.12, sy: 0.10 + Math.random() * 0.12,\n      ox: Math.random() * 100, oy: Math.random() * 100,\n    };\n  });\n  function applyPalette() { for (const bl of BLOBS) bl.c = PAL[bl.pi]; }\n\n  // Flow field the blobs swim through — frequency scales the spatial\n  // detail, noiseType picks the field shape.\n  function flow(x, y, t) {\n    const f = FREQ;\n    if (NOISE === 'waves') {\n      return [Math.sin(y * 2.2 * f + t) * 0.5, Math.cos(x * 2.0 * f - t) * 0.35];\n    }\n    if (NOISE === 'swirl') {\n      const ang = Math.atan2(y - 0.5, x - 0.5), r = Math.hypot(x - 0.5, y - 0.5);\n      return [Math.cos(ang + r * 7 * f + t) * 0.5, Math.sin(ang + r * 7 * f + t) * 0.5];\n    }\n    if (NOISE === 'ripple') {\n      const r = Math.hypot(x - 0.5, y - 0.5);\n      const s = Math.sin(r * 14 * f - t * 1.4);\n      return [(x - 0.5) * s * 0.9, (y - 0.5) * s * 0.9];\n    }\n    // curl (default)\n    const a = Math.sin(x * 3.1 * f + t * 0.6) + Math.cos(y * 2.7 * f - t * 0.5);\n    const b = Math.cos(x * 2.3 * f - t * 0.4) + Math.sin(y * 3.3 * f + t * 0.7);\n    return [Math.cos(a * 1.6) * 0.5, Math.sin(b * 1.6) * 0.5];\n  }\n\n  let mx = 0.5, my = 0.5, mActive = 0, t0 = performance.now();\n  hero.addEventListener('pointermove', (e) => {\n    const r = hero.getBoundingClientRect();\n    mx = (e.clientX - r.left) / r.width;\n    my = (e.clientY - r.top) / r.height;\n    mActive = 1;\n  }, { passive: true });\n  hero.addEventListener('pointerenter', () => { mActive = 1; start(); });\n  hero.addEventListener('pointerleave', () => { mActive = 0; start(); });\n  let hovering = false;\n  hero.addEventListener('pointerenter', () => { hovering = true; });\n  hero.addEventListener('pointerleave', () => { hovering = false; });\n\n  function frame(now) {\n    // Time-based integration — motion is proportional to real elapsed time,\n    // so it stays smooth at any refresh rate (no fixed-step jitter).\n    if (!lastTime) lastTime = now;\n    let dt = (now - lastTime) / 1000; lastTime = now;\n    if (dt > 0.05) dt = 0.05;           // clamp after a tab switch / stall\n    clock += dt * SPEED;                 // field phase advances with speed\n    const t = clock;\n    mInf += ((mActive ? 1 : 0) - mInf) * Math.min(1, dt * 6);\n    // advance blobs along the flow field + their own slow orbit (per-second).\n    for (const bl of BLOBS) {\n      const [vx, vy] = flow(bl.x, bl.y, t);\n      bl.x += ((vx * 0.34) + Math.cos(bl.px + t * bl.sx) * 0.16) * SPEED * dt;\n      bl.y += ((vy * 0.34) + Math.sin(bl.py + t * bl.sy) * 0.16) * SPEED * dt;\n      // gentle, bounded drift around the cursor while hovering (speed-independent).\n      // Softer falloff + lower cap so edge hovers don't fling blobs out.\n      if (mInf > 0.001) {\n        const dx = bl.x - mx, dy = bl.y - my, d2 = dx * dx + dy * dy + 0.09;\n        const f = Math.min(0.007 / d2, 0.045) * mInf * dt;\n        bl.x += -dy * f;  // tangential → soft swirl\n        bl.y +=  dx * f;\n      }\n      // ease back toward the home anchor — keeps the field stable, no runaway\n      bl.x += (bl.hx - bl.x) * 0.6 * dt;\n      bl.y += (bl.hy - bl.y) * 0.6 * dt;\n      // hard clamp as a safety net (clamp, never teleport → no colour pops)\n      if (bl.x < -0.15) bl.x = -0.15; else if (bl.x > 1.15) bl.x = 1.15;\n      if (bl.y < -0.15) bl.y = -0.15; else if (bl.y > 1.15) bl.y = 1.15;\n    }\n\n    // Opaque deep-red base (unblurred) so edges never reveal white.\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.filter = 'none';\n    ctx.fillStyle = '#06201e';\n    ctx.fillRect(0, 0, w, h);\n    // Blur the blobs in-canvas — cheap at this resolution, smooth on upscale.\n    ctx.filter = 'blur(' + BLUR + 'px)';\n    for (const bl of BLOBS) {\n      const cx = bl.x * w, cy = bl.y * h;\n      const rad = Math.max(bl.rx, bl.ry) * Math.max(w, h);\n      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);\n      g.addColorStop(0, bl.c);\n      g.addColorStop(1, bl.c + '00');\n      ctx.fillStyle = g;\n      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.fill();\n    }\n    ctx.filter = 'none';\n    // Only animate while the cursor is over the hero (the field is invisible\n    // otherwise). When the pointer leaves, ease out then fully stop — nothing\n    // runs in the background, so there's no pre-hover stutter.\n    if (mActive || mInf > 0.01) { running = true; requestAnimationFrame(frame); }\n    else if (settle-- > 0) { requestAnimationFrame(frame); }\n    else { running = false; lastTime = 0; }\n  }\n  let running = false, settle = 0, lastTime = 0, clock = 0, mInf = 0;\n  function start() { settle = 12; if (!running) { running = true; lastTime = 0; requestAnimationFrame(frame); } }\n  start(); // brief warm-up render, then idle until first hover\n\n  // ── Tweaks panel (host-gated; hidden unless edit mode is on) ──────────────\n  const heroEl = hero;\n  const HG = ['--hg1', '--hg2', '--hg3'];\n  let HGV = [TWEAKS.heroStop1, TWEAKS.heroStop2, TWEAKS.heroStop3];\n  HG.forEach((v, i) => heroEl.style.setProperty(v, HGV[i]));\n\n  const panel = document.createElement('div');\n  panel.className = 'fab-cpanel';\n  panel.innerHTML =\n    '<div class=\"fcp-body\">' +\n      '<div class=\"fcp-title\">Tweaks <button class=\"fcp-x\" aria-label=\"Close\">\\u00d7<\u002Fbutton><\u002Fdiv>' +\n      '<div class=\"fcp-h\">Hero Gradient<\u002Fdiv>' +\n      '<div class=\"fcp-grp\" id=\"fcpHero\"><\u002Fdiv>' +\n      '<div class=\"fcp-h\">Mesh Colours<\u002Fdiv>' +\n      '<div class=\"fcp-grp\" id=\"fcpMesh\"><\u002Fdiv>' +\n      '<div class=\"fcp-h\">Motion<\u002Fdiv>' +\n      '<div class=\"fcp-grp\" id=\"fcpMotion\"><\u002Fdiv>' +\n      '<button class=\"fcp-reset\">Reset to default<\u002Fbutton>' +\n    '<\u002Fdiv>';\n  document.body.appendChild(panel);\n\n  function save(edits) { try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*'); } catch (e) {} }\n  // expose so colour/motion handlers can wake the render loop\n  window.__fabStart = () => { try { start(); } catch (e) {} };\n\n  function swatch(label, value, on) {\n    const row = document.createElement('label');\n    row.className = 'fcp-row';\n    const sw = document.createElement('input'); sw.type = 'color'; sw.value = value;\n    const tx = document.createElement('span'); tx.className = 'fcp-val'; tx.textContent = value.toUpperCase();\n    const nm = document.createElement('span'); nm.className = 'fcp-nm'; nm.textContent = label;\n    sw.addEventListener('input', () => { tx.textContent = sw.value.toUpperCase(); on(sw.value); });\n    row.appendChild(sw); row.appendChild(nm); row.appendChild(tx);\n    return row;\n  }\n\n  function slider(label, min, max, step, value, on) {\n    const row = document.createElement('div');\n    row.className = 'fcp-row fcp-srow';\n    const nm = document.createElement('span'); nm.className = 'fcp-nm'; nm.textContent = label;\n    const tx = document.createElement('span'); tx.className = 'fcp-val'; tx.textContent = (+value).toFixed(2);\n    const sl = document.createElement('input'); sl.type = 'range'; sl.min = min; sl.max = max; sl.step = step; sl.value = value; sl.className = 'fcp-range';\n    sl.addEventListener('input', () => { tx.textContent = (+sl.value).toFixed(2); on(+sl.value); });\n    const top = document.createElement('div'); top.className = 'fcp-srow-top'; top.appendChild(nm); top.appendChild(tx);\n    row.appendChild(top); row.appendChild(sl);\n    return row;\n  }\n  function select(label, opts, value, on) {\n    const row = document.createElement('label');\n    row.className = 'fcp-row';\n    const nm = document.createElement('span'); nm.className = 'fcp-nm'; nm.textContent = label;\n    const se = document.createElement('select'); se.className = 'fcp-select';\n    opts.forEach((o) => { const op = document.createElement('option'); op.value = o; op.textContent = o[0].toUpperCase() + o.slice(1); if (o === value) op.selected = true; se.appendChild(op); });\n    se.addEventListener('change', () => on(se.value));\n    row.appendChild(nm); row.appendChild(se);\n    return row;\n  }\n\n  const meshWrap = panel.querySelector('#fcpMesh');\n  const heroWrap = panel.querySelector('#fcpHero');\n  const motionWrap = panel.querySelector('#fcpMotion');\n  function buildRows() {\n    meshWrap.innerHTML = ''; heroWrap.innerHTML = ''; motionWrap.innerHTML = '';\n    HGV.forEach((c, i) => heroWrap.appendChild(swatch('Stop ' + (i + 1), c, (v) => {\n      HGV[i] = v; heroEl.style.setProperty(HG[i], v); save({ ['heroStop' + (i + 1)]: v });\n    })));\n    PAL.forEach((c, i) => meshWrap.appendChild(swatch('Colour ' + (i + 1), c, (v) => {\n      PAL[i] = v; applyPalette(); start(); save({ ['mesh' + (i + 1)]: v });\n    })));\n    motionWrap.appendChild(select('Noise type', ['curl', 'waves', 'swirl', 'ripple'], NOISE, (v) => { NOISE = v; start(); save({ noiseType: v }); }));\n    motionWrap.appendChild(slider('Frequency', 0.2, 3, 0.05, FREQ, (v) => { FREQ = v; start(); save({ frequency: v }); }));\n    motionWrap.appendChild(slider('Speed', 0, 3, 0.05, SPEED, (v) => { SPEED = v; start(); save({ speed: v }); }));\n  }\n  buildRows();\n\n  function closePanel() { panel.classList.remove('open'); try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch (e) {} }\n  panel.querySelector('.fcp-x').addEventListener('click', closePanel);\n  panel.querySelector('.fcp-reset').addEventListener('click', () => {\n    PAL = ['#7FD0C0', '#1E9A88', '#0A3B38'];\n    HGV = ['#6FC6B6', '#1E8A7C', '#08312F'];\n    FREQ = 0.2; SPEED = 0; NOISE = 'curl';\n    applyPalette(); HG.forEach((v, i) => heroEl.style.setProperty(v, HGV[i])); start();\n    save({ mesh1: PAL[0], mesh2: PAL[1], mesh3: PAL[2], heroStop1: HGV[0], heroStop2: HGV[1], heroStop3: HGV[2], frequency: FREQ, speed: SPEED, noiseType: NOISE });\n    buildRows();\n  });\n\n  // Host edit-mode wiring — register listener BEFORE announcing availability.\n  window.addEventListener('message', (e) => {\n    const d = e.data || {};\n    if (d.type === '__activate_edit_mode') panel.classList.add('open');\n    else if (d.type === '__deactivate_edit_mode') panel.classList.remove('open');\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}\n})();\n<\u002Fscript>\n\n<script>\n(() => {\n  const hero = document.querySelector('.hero');\n  if (!hero) return;\n\n  const EMBLEM = '<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"currentColor\"/><\u002Fsvg>';\n\n  const BLACK = '#BFE6DC';\n  const SIZES = [88, 60, 72, 52, 80, 64, 56, 76, 60, 68, 52, 84, 60];\n\n  const layer = document.createElement('div');\n  layer.className = 'hero-emblems';\n  layer.setAttribute('aria-hidden', 'true');\n  document.body.appendChild(layer);\n\n  const items = SIZES.map(s => {\n    const el = document.createElement('div');\n    el.className = 'hero-emblem';\n    el.style.width = el.style.height = s + 'px';\n    el.style.color = BLACK;\n    el.innerHTML = EMBLEM;\n    layer.appendChild(el);\n    return {\n      el, s,\n      r: (s / 2) * 0.74,        // collision radius (tight so they overlap/nest)\n      x: 0, y: 0, vx: 0, vy: 0,\n      rot: 0,\n    };\n  });\n\n  // Pile pocket: the genuinely-empty zone on the right, to the RIGHT of\n  // the headline/tagline and ABOVE the hero-foot (lede / scroll / credit).\n  // Measured from the live element boxes so the walls always keep the\n  // marks clear of text, even when the cursor knocks the pile.\n  const titleEl = hero.querySelector('.hero-title');\n  const eyebrowEl = hero.querySelector('.eyebrow-row');\n  const taglineEl = hero.querySelector('.ln-ital');\n  const peraNode = hero.querySelector('.hero-title .ln');  // holds \"Fabrika\" + tagline\n  // Right edge of just the FIRST line of the title (the \"PERA\" word),\n  // ignoring the wide italic tagline that sits on the line below it.\n  function peraRight() {\n    if (!peraNode) return 0;\n    const range = document.createRange();\n    range.selectNodeContents(peraNode);\n    const rects = range.getClientRects();\n    // first rect = the \"Fabrika\" glyph run before the tagline wraps\n    return rects.length ? rects[0].right : 0;\n  }\n  let W = 0, H = 0, leftWall = 0, rightWall = 0, floorY = 0, ceil = 0;\n  let seeded = false;\n  let running = true, raf = 0;\n  function layout() {\n    const hr = hero.getBoundingClientRect();\n    H = hr.height;\n    W = document.documentElement.clientWidth;\n    layer.style.top = hero.offsetTop + 'px';\n    layer.style.width = W + 'px';\n    layer.style.height = H + 'px';\n\n    // Pocket = the empty top-right band: right of the \"PERA\" word,\n    // below the eyebrow strip, above the italic tagline.\n    const pr = peraRight();\n    const eb = eyebrowEl ? eyebrowEl.getBoundingClientRect() : null;\n    const tg = taglineEl ? taglineEl.getBoundingClientRect() : null;\n    leftWall  = Math.max(W * 0.46, (pr ? pr - hr.left : W * 0.5) + 32);\n    rightWall = W - 18;\n    ceil      = (eb ? eb.bottom - hr.top : H * 0.30) + 14;\n    floorY    = (tg ? tg.top - hr.top : H * 0.78) - 14;\n\n    // Too little blank room (narrow screens), hide the pile entirely.\n    const tooTight = (rightWall - leftWall) < 150 || (floorY - ceil) < 90;\n    layer.style.display = tooTight ? 'none' : 'block';\n    running = !tooTight;\n\n    if (!seeded && !tooTight) {\n      const pocketW = rightWall - leftWall;\n      items.forEach((it, i) => {\n        it.x = leftWall + it.r + Math.random() * Math.max(pocketW - it.r * 2, 1);\n        it.y = ceil - 30 - i * 40;\n        it.vx = (Math.random() - 0.5) * 1.2;\n      });\n      seeded = true;\n    } else {\n      for (const it of items) {\n        it.x = Math.max(leftWall + it.r, Math.min(rightWall - it.r, it.x));\n        it.y = Math.min(floorY - it.r, it.y);\n      }\n    }\n    // Restart the physics loop if a previous (tight) layout had stopped it.\n    if (running && !raf) raf = requestAnimationFrame(step);\n  }\n  layout();\n  window.addEventListener('resize', layout);\n  window.addEventListener('load', layout);\n  setTimeout(layout, 350);   // re-measure once fonts settle the title width\n\n  // Pointer tracking in layer-local coords.\n  let mx = -9999, my = -9999, active = false;\n  window.addEventListener('pointermove', (e) => {\n    const r = layer.getBoundingClientRect();\n    mx = e.clientX - r.left; my = e.clientY - r.top;\n    active = mx >= -80 && mx <= r.width + 80 && my >= -80 && my <= r.height + 80;\n  }, { passive: true });\n  window.addEventListener('pointerleave', () => { active = false; });\n\n  const G = 0.55;       // gravity\n  const AIR = 0.992;    // air drag\n  const REST = 0.16;    // floor/wall restitution\n  const FRICT = 0.82;   // ground friction\n  const CURSOR_R = 120; // cursor knock radius\n  const CURSOR_F = 2.6; // cursor knock force\n  const SLOP = 1.5;     // allowed overlap before correcting (kills resting shimmer)\n  const CORR = 0.55;    // positional correction factor (<1 = softer, less jitter)\n\n  function step() {\n    if (!running) { raf = 0; return; }\n\n    // Integrate, gravity, cursor knock, air drag.\n    for (const it of items) {\n      it.vy += G;\n      if (active) {\n        const dx = it.x - mx, dy = it.y - my;\n        const d = Math.hypot(dx, dy) || 1;\n        if (d < CURSOR_R) {\n          const f = (1 - d / CURSOR_R) * CURSOR_F;\n          it.vx += (dx / d) * f * 6;\n          it.vy += (dy / d) * f * 6;\n        }\n      }\n      it.vx *= AIR; it.vy *= AIR;\n      it.x += it.vx; it.y += it.vy;\n    }\n\n    // Resolve circle–circle collisions (a few relaxation passes).\n    for (let pass = 0; pass < 4; pass++) {\n      for (let i = 0; i < items.length; i++) {\n        for (let j = i + 1; j < items.length; j++) {\n          const a = items[i], b = items[j];\n          let dx = b.x - a.x, dy = b.y - a.y;\n          let d = Math.hypot(dx, dy);\n          const min = a.r + b.r;\n          if (d < min && d > 0) {\n            // Only correct the overlap beyond a small slop, and softly, so\n            // resting/nested bottles don't shimmer back and forth each frame.\n            const corr = Math.max(0, (min - d - SLOP)) * 0.5 * CORR;\n            const nx = dx / d, ny = dy / d;\n            a.x -= nx * corr; a.y -= ny * corr;\n            b.x += nx * corr; b.y += ny * corr;\n            // exchange a little velocity along the normal (soft, no energy gain)\n            const rvx = b.vx - a.vx, rvy = b.vy - a.vy;\n            const vn = rvx * nx + rvy * ny;\n            if (vn < 0) {\n              const imp = vn * 0.3;\n              a.vx += nx * imp; a.vy += ny * imp;\n              b.vx -= nx * imp; b.vy -= ny * imp;\n            }\n          }\n        }\n      }\n      // Walls + floor each pass so stacks stay put.\n      for (const it of items) {\n        if (it.x - it.r < leftWall)  { it.x = leftWall + it.r;  it.vx *= -REST; }\n        if (it.x + it.r > rightWall) { it.x = rightWall - it.r; it.vx *= -REST; }\n        if (it.y + it.r > floorY)    { it.y = floorY - it.r;    it.vy *= -REST; it.vx *= FRICT; }\n        if (it.y - it.r < ceil - 560){ it.y = ceil - 560 + it.r; it.vy *= -REST; }\n      }\n    }\n\n    // Render, rotation rolls with horizontal motion.\n    for (const it of items) {\n      // Sleep tiny residual motion so a settled pile is perfectly still.\n      if (Math.abs(it.vx) < 0.08) it.vx = 0;\n      if (!active && Math.abs(it.vy) < 0.08 && it.y + it.r > floorY - 1) it.vy = 0;\n      it.rot += it.vx * 0.5;\n      it.el.style.transform =\n        `translate(${(it.x - it.s / 2).toFixed(2)}px, ${(it.y - it.s / 2).toFixed(2)}px) rotate(${it.rot.toFixed(2)}deg)`;\n    }\n    raf = requestAnimationFrame(step);\n  }\n  raf = requestAnimationFrame(step);\n\n  if ('IntersectionObserver' in window) {\n    new IntersectionObserver(([en]) => {\n      running = en.isIntersecting;\n      if (running && !raf) raf = requestAnimationFrame(step);\n    }, { threshold: 0 }).observe(layer);\n  }\n})();\n<\u002Fscript>\n\n  <!-- Lightbox, click a post image to expand; move the pointer off it to revert -->\n  <div class=\"lightbox\" id=\"lightbox\" aria-hidden=\"true\" role=\"dialog\" aria-modal=\"true\">\n    <figure>\n      <img id=\"lightboxImg\" alt=\"\">\n      <figcaption id=\"lightboxCap\">Click anywhere · Esc to close<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n<script>\n(() => {\n  const lb = document.getElementById('lightbox');\n  const img = document.getElementById('lightboxImg');\n  const cap = document.getElementById('lightboxCap');\n  if (!lb || !img) return;\n  let open = false;\n\n  function show(src, alt) {\n    img.src = src;\n    img.alt = alt || '';\n    cap.textContent = alt || 'Click anywhere to close';\n    lb.classList.add('open');\n    lb.setAttribute('aria-hidden', 'false');\n    open = true;\n  }\n  function hide() {\n    if (!open) return;\n    lb.classList.remove('open');\n    lb.setAttribute('aria-hidden', 'true');\n    open = false;\n  }\n\n  // Bind every filled post / lookbook thumbnail.\n  document.querySelectorAll('.post-grid .ph.is-filled, .lg-grid .ph.is-filled').forEach(cell => {\n    const thumb = cell.querySelector('img');\n    if (!thumb) return;\n    cell.addEventListener('click', () => {\n      const full = thumb.getAttribute('data-full') || thumb.getAttribute('src');\n      show(full, thumb.alt);\n    });\n  });\n\n  // Click anywhere (image or backdrop) reverts to the grid; Esc also closes.\n  lb.addEventListener('click', hide);\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });\n})();\n<\u002Fscript>\n\n<style>\n  @media (prefers-reduced-motion: no-preference) {\n    .reveal { opacity: 0; transform: translateY(30px); transition: opacity .85s cubic-bezier(.2,.7,.2,1), transform .85s cubic-bezier(.2,.7,.2,1); }\n    .reveal.is-in { opacity: 1; transform: none; }\n    .reel-rail .ph { transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s ease; will-change: transform; }\n  }\n<\u002Fstyle>\n<script>\n  /* Scroll effects: (1) fade-up reveal as blocks enter the viewport,\n     (2) center-focus on the reel rail — the card nearest the rail's\n     centre grows while the others recede as you swipe. */\n  (function() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    /* (1) Reveal on enter */\n    const revealSel = '.module-head, .body-grid > div, .process .step, .stats .stat, .credits, .lg-grid .ph, .post-grid .ph, .bleed .ph, figure.ph, .quote, .next-inner, .meta-cell';\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -7% 0px' });\n    document.querySelectorAll(revealSel).forEach(el => {\n      if (el.closest('.reel-rail')) return;\n      el.classList.add('reveal');\n      io.observe(el);\n    });\n\n    /* (2) Reel rail center-focus */\n    const rail = document.querySelector('.reel-rail');\n    if (rail) {\n      const cards = [...rail.querySelectorAll('.ph')];\n      let raf = 0;\n      function update() {\n        const mid = rail.scrollLeft + rail.clientWidth / 2;\n        const span = rail.clientWidth / 1.5;\n        for (const c of cards) {\n          const cc = c.offsetLeft + c.offsetWidth / 2;\n          const d = Math.min(Math.abs(cc - mid) / span, 1);\n          c.style.transform = 'scale(' + (1 - 0.16 * d).toFixed(3) + ')';\n          c.style.opacity = (1 - 0.5 * d).toFixed(3);\n        }\n        raf = 0;\n      }\n      const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };\n      rail.addEventListener('scroll', onScroll, { passive: true });\n      window.addEventListener('resize', onScroll);\n      new IntersectionObserver(() => onScroll(), { threshold: 0.05 }).observe(rail);\n      window.addEventListener('load', onScroll);\n      setTimeout(onScroll, 400);\n      requestAnimationFrame(update);\n    }\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"_aa_standalone_src"}
